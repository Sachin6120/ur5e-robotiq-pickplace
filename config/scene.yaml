# scene.yaml — SINGLE SOURCE OF TRUTH
#
# Read by, and only by, these three consumers:
#   1. the Gazebo world spawner        (where the object physically is)
#   2. the static TF publisher          (object_frame in the TF tree)
#   3. the MoveIt planning scene loader (table + object as CollisionObjects)
#
# Because all three read this file, sim and planner cannot drift apart.
# Nothing downstream is permitted to hardcode a pose. If you find yourself
# typing a coordinate into a .cpp or .launch.py file, it belongs here instead.
#
# Fields marked  # RECON  are placeholders. They are filled from the output of
# scripts/00_recon.sh run against the real merged URDF. Do not guess them.

# ---------------------------------------------------------------------------
robot:
  arm_joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  # Matches the URDF's ros2_control initial_value entries and the SRDF `home`
  # pose, so MoveIt's idea of home and Gazebo's spawn pose agree.
  home_positions: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]

  # base_link's pose in `world`. Passed through to the sim spawn launch as
  # base_xyz/base_rpy (ur5e_robotiq_sim_control.launch.py already exposes
  # these as launch args; a ground-mounted default of 0,0,0 was used through
  # M0/M1, which never needed to reach down to table height).
  #
  # RAISED to table height for M2. Found empirically via compute_ik sweeps
  # (moveit_msgs/srv/GetPositionIK, group 'arm', link 'tool0'): with tool0
  # pointed straight down (grasp.approach_axis's whole premise) and the base
  # at z=0, reachable height tops out around z=0.85-0.90m at ANY horizontal
  # offset tested (0.2m to 0.474m radius) — moving the object closer
  # horizontally did not help, because the limit is a straight-down-specific
  # wrist configuration constraint, not a radius/workspace-boundary one.
  # The grasp target alone (object.pick_pose.z + grasp.tcp_offset, BEFORE any
  # standoff) already needs tool0 at ~0.915m — past that ceiling. A
  # ground-mounted base cannot do this approach at all, regardless of
  # standoff or the object's horizontal position.
  #
  # x, y unchanged (0,0) so the horizontal geometry already measured/verified
  # (tcp_offset, M0-C, M1) is untouched; only z changes, matching table.surface_z
  # so the base effectively sits at table height. Re-verify reachability
  # after any further change to object.pick_pose or grasp.standoff — this
  # was tested for THIS specific object height and horizontal offset, not
  # proven in general.
  base_pose:
    x: 0.0
    y: 0.0
    z: 0.75
    roll:  0.0
    pitch: 0.0
    yaw:   0.0

# ---------------------------------------------------------------------------
frames:
  world:  world
  base:   base_link
  flange: tool0            # confirmed via recon: wrist_3_link -(0,0,0 / 0,-pi/2,-pi/2)->
                            # flange -(0,0,0 / pi/2,0,pi/2)-> tool0. Gripper mounts at
                            # tool0 (ROS-Industrial all-zeros tool convention).
  tcp:    grasp_tcp        # frame published at the finger-pad contact midpoint

# ---------------------------------------------------------------------------
table:
  # Box collision object. `pose` is the CENTRE of the box, expressed in `world`.
  size: [1.20, 0.80, 0.75]          # x, y, z  [m]
  pose:
    x: 0.55
    y: 0.00
    z: 0.375                        # = size.z / 2, so the base sits on z=0
    roll:  0.0
    pitch: 0.0
    yaw:   0.0
  surface_z: 0.75                   # derived: pose.z + size.z/2

# ---------------------------------------------------------------------------
object:
  name: pick_target
  type: box
  # HEIGHT CHANGED 2026-08-09 (0.090 -> 0.045, a cube): the 90mm object
  # left only ~4.7mm of vertical clearance between the gripper's inner
  # knuckle links and the object's top face even under perfect grasp
  # positioning -- a structural gripper/object-HEIGHT incompatibility, not
  # a targeting bug. See docs/HANDOFF_M3.md, "Positioned wrong or built
  # wrong? -- resolved via URDF geometry." Formula derived and validated
  # there: knuckle_clearance_mm ~= 50 - (height_mm / 2), confirmed against
  # the live-measured 4.7mm at height=90mm (predicts 5.0mm). At the new
  # 45mm height: ~27.5mm clearance -- comfortable, not marginal.
  # WIDTH is UNCHANGED (still 0.045m) specifically so this stays inside
  # the already-measured grasp table (docs/grasp_table_20260808_135745.log)
  # -- tcp_offset, pad_centre_offset, grip_angle, and width_at_grip are all
  # functions of aperture/width, not height, so none of that measured data
  # is invalidated by this change.
  size: [0.030, 0.045, 0.045]       # x, y, z  [m]
  # DEPRECATED 2026-08-21 (M6), kept only as a cross-check. This index is no
  # longer what selects the grasp width: scene_xacro_args.resolve_closing_axis()
  # DERIVES the axis from grasp.approach_axis + grasp.gripper_roll (+
  # gripper.mount_rotation) and raises CONFIG_ERROR if this value disagrees
  # with that derivation. Do not hand-set this from approach_axis alone --
  # gripper_roll rotates the closing direction about the approach axis and
  # changes which object axis it lands on.
  #
  # CURRENT (verified live against resolve_closing_axis(), 2026-08-30): with
  # approach_axis=[0.0, 0.0, -1.0] and gripper_roll=1.57079632679 rad
  # (pi/2), the derived closing axis is object-frame X (alignment=1.0,
  # axis_index=0), matching size[0]=0.030 m -- i.e. grasp_width_axis=0 below
  # is correct and the cross-check raises no CONFIG_ERROR.
  #
  # HISTORICAL BUG this cross-check exists to catch (M6, 2026-08-21): under a
  # DIFFERENT gripper_roll than today's, this field was left at 0 while the
  # derived closing axis was object-frame Y (size[1]), silently feeding
  # 0.030 m to a grasp that physically closed on 0.045 m -- a 0.1069 rad
  # grip-angle error against a 0.0235 rad tolerance. It was unobservable
  # while the object was a 45mm CUBE (size[0] == size[1]); M6's change to
  # [0.030, 0.045, 0.045] was the first configuration where the two
  # differed. Re-derive this value (do not hand-edit it) any time
  # approach_axis, gripper_roll, or mount_rotation changes.
  grasp_width_axis: 0               # index into size[] the fingers close ACROSS
  mass: 0.150                       # [kg]

  # Pose is the CENTRE of the object, in `world`.
  # z = table.surface_z + size.z/2  so it rests on the table, not in it.
  pick_pose:
    x:  0.450
    y: -0.150
    z:  0.7725
    roll:  0.0
    pitch: 0.0
    yaw:   0.0

  place_pose:
    x:  0.450
    y:  0.200
    z:  0.7725
    roll:  0.0
    pitch: 0.0
    yaw:   0.0

  # Surface physics. DART is Harmonic's default engine — ODE-era Gazebo Classic
  # friction folklore does NOT transfer. These are starting points to be
  # re-derived during M3, not values copied from a working ODE setup.
  surface:
    mu:  1.0                        # M3 tuning knob
    mu2: 1.0                        # M3 tuning knob
    restitution: 0.0

# ---------------------------------------------------------------------------
grasp:
  # The grasp is defined RELATIVE TO object_frame. Move the object in this file
  # and the grasp, pre-grasp, lift and place all follow automatically through
  # tf2 composition. Nothing is expressed as a world-Z offset.

  approach_axis: [0.0, 0.0, -1.0]   # in object_frame: descend from above
  standoff:      0.100              # pre-grasp distance back along -approach [m]
  retreat:       0.120              # post-grasp lift distance along -approach [m]
  gripper_roll:  1.57079632679      # rotation about the approach axis [rad]

  # Held stationary (on the node's own clock, not a wall sleep) after
  # LIFT_DONE and TRANSPORT_DONE, so the M3 harness's windowed-quiescence
  # sampler (scripts/lib/sample_pose.py) has an actual stationary window to
  # take a settled slip-baseline/comparison pose in. Without this the node
  # started planning the transport ~20ms after LIFT_DONE fired -- no window
  # at all. 2.0s is comfortably longer than sample_pose.py's default
  # window_s=1.0, with margin for the sim's real-time factor sagging under
  # load rather than holding exactly 1.0.
  slip_sample_dwell_s: 2.0

  # Distance from tool0 to the finger-pad contact midpoint, along tool0's
  # local Z ("front", ROS-Industrial convention) — the last open item from
  # M-1_reference_report.md §6. Measured live against Gazebo ground truth
  # (gz pose/info for wrist_3_link + the two fingertip links, not TF —
  # same reasoning as M0-C: this should be measured independent of what
  # MoveIt/robot_state_publisher believes, not assumed to agree with it).
  # tool0 itself never appears in the pose topic — it, flange,
  # robotiq_85_base_link and ur_to_robotiq_link are all fixed-joint-lumped
  # into wrist_3_link at the physics level (visible in the pose topic as
  # "wrist_3_link_fixed_joint_lump__..." entries). Since every joint in that
  # chain has zero translation (confirmed by recon), tool0's world POSITION
  # equals wrist_3_link's; only its orientation differs, by the two known
  # fixed rotations. Reconstructed tool0's orientation from wrist_3_link's
  # plus those two rotations, then projected (fingertip_midpoint - tool0_pos)
  # onto tool0's resulting local Z axis.
  #
  # CONFIRMED: lateral symmetry holds across the whole joint range — the
  # fingertip midpoint sits on tool0's Z axis to within ~2e-7 m regardless of
  # aperture, so tcp_offset is a clean single-axis distance, not an
  # approximation of one.
  #
  # NOT CONFIRMED, and initially assumed rather than checked: that the
  # four-bar linkage holds this distance constant as the gripper opens and
  # closes. It does not. Measured across the full range:
  #   master (rad)   tcp_offset (m)
  #     0.000            0.1093   (fully open)
  #     0.200            0.1158
  #     0.400            0.1204
  #     0.600            0.1227
  #     0.767            0.1230   (near fully closed)
  # 13.6 mm of variation, non-linear (fast rise, then saturating) — bigger
  # than M3's own 5 mm slip criterion, so treating this as one fixed scalar
  # is a real approximation, not a measured constant like the rest of this
  # file's recon-derived values.
  #
  # UPDATED 2026-08-08 from docs/grasp_table_20260808_135745.log (script:
  # scripts/06_measure_grasp_table.sh), which measures tcp_offset AT CONTACT
  # for a real object width, not interpolated by eye from a free-space table.
  # object.size[grasp_width_axis] here is 0.045m, an EXACT match to one of
  # the 5 swept widths (no interpolation needed): grip_angle=0.40553 rad,
  # tcp_offset_at_grip=0.120405 m. tcp_offset_at_grip is joint/fingertip-pose
  # driven and independently validated (achieved angle landed in the
  # established 0.4358-0.4593 cluster at the 40mm anchor) — trust this part.
  #
  # pad_centre_offset is a SEPARATE, ADDITIONAL correction below, not folded
  # into this number: the pad contact surface sits further from tool0 than
  # the fingertip-link-origin point tcp_offset_at_grip is anchored to (see
  # grasp.pad_centre_offset below). Do not add it in here; keep the two
  # named separately so a future re-measurement of either doesn't require
  # unpicking a combined scalar.
  #
  # RE-DERIVE if object.size changes: this value is an exact-width lookup
  # against ONE swept object, not a general function of width. If the object
  # width changes and no longer exactly matches a swept row, interpolate
  # between docs/grasp_table_20260808_135745.log's rows rather than reusing
  # this scalar as-is.
  tcp_offset: 0.120405

  # Distance FURTHER than tcp_offset_at_grip (above) that the true pad
  # contact surface sits from tool0, along the same axis. Blocker 2 proved
  # this geometrically (docs/HANDOFF_M3.md): the object seats DOWN from the
  # fingertip-link-origin height tcp_offset is anchored to, onto the true pad
  # centre, by this much. Original measurement ~12.1-13.7mm.
  #
  # VALUE BELOW IS FROM m0_verify.sh's M0-C, 2026-08-08
  # (docs/m0_20260808_*.log), post settle-check fix: box before close
  # 1.116769 m, box after 1.103336 m, drop 0.013433 m. This superseded an
  # earlier same-day anchor re-measurement of 0.010188 m
  # (docs/grasp_table_20260808_135745.log's AMENDMENT section) that turned
  # out to have ITS OWN baseline artifact: that ad-hoc diagnostic's "before"
  # sample was taken in a separate tool call after a "settled" declaration,
  # and the real-world gap between them let the box drift ~2.9mm further
  # before the baseline was actually read — computed from the SAME true
  # spawn-height baseline M0-C uses, that same data gives 0.013075 m,
  # consistent with M0-C's clean value and with the original ~12.1-13.7mm
  # figures. Net finding: the historical figures were essentially converged
  # and valid all along; the ~0.001-0.002m figures earlier the same day were
  # the false-quiescence bug (fixed), and the ~0.010m figure after that fix
  # was a separate, narrower baseline-timing artifact (not a bug in the fix
  # itself, a gap specific to interactive multi-turn measurement). Use
  # M0-C's number: it's a single script's before/after sample with no
  # cross-tool-call gap in between.
  #
  # NOT YET LIVE-VERIFIED: the SIGN/DIRECTION this should be applied in
  # grasp composition (i.e. that the corrected effective offset is
  # tcp_offset + pad_centre_offset, moving tool0 FARTHER from the object,
  # not closer). Reasoned from geometry (tool0 sits above the object during
  # a vertical approach; the true contact point is deeper/lower than the
  # naive anchor, so tool0 must stand off farther to still meet it at the
  # right depth), not confirmed by a live grasp using the corrected target.
  # This project has been burned by exactly this kind of sign/frame mixup
  # before (tcp_offset's original anchor-frame confusion, the shortfall-vs-
  # achieved-angle units error) — verify with a live approach-and-grasp
  # before trusting this in an unattended run.
  #
  # SINGLE-SCALAR PLACEHOLDER, not a per-width table: the 5-width table in
  # docs/grasp_table_20260808_135745.log has an invalid pad_centre_offset
  # column (see its AMENDMENT section) because the same false-quiescence bug
  # hit all 5 rows, not just this one. The fix (gz_settle_pose_windowed,
  # scripts/lib/gz_settle.py) is applied and validated, but the full 5-width
  # re-sweep to get a genuine per-width table has NOT been re-run (~150s/
  # width with the corrected settle window — known follow-up, deliberately
  # deferred). Until then this one re-confirmed anchor value is used for
  # every width, same treatment tcp_offset itself got before this update.
  #
  # SUPERSEDED 2026-08-11: the 0.013433 figure above came from an object-
  # drop-on-settle measurement — indirect, and folds in whatever compliance/
  # seating happens at contact, not pure rigid pad geometry. Replaced with a
  # direct measurement of the same quantity: scripts/lib/gripper_geometry.py
  # parses left_finger_tip.stl (the exact mesh the URDF's own <collision>
  # points at) and finds the pad face's z-centroid in the fingertip link's
  # own frame — no live sim, no settle timing, no object needed at all.
  # PAD_FACE_Z_CENTROID_M = 0.031573 m, an 18.14 mm gap from the old value,
  # in the same neighbourhood as this project's own previously-flagged
  # "~32mm magnitude residual still open" (pad-centre correction,
  # 2026-08-09) — a candidate explanation for that residual, not yet
  # confirmed as THE explanation. tcp_offset_m() in that module was
  # cross-checked against every point in this file's own free-space table
  # above (0.000/0.200/0.400/0.600/0.767 rad) before this value was trusted.
  # Direction still not live-verified (see NOT YET LIVE-VERIFIED note above,
  # which continues to apply) — this trial is that verification.
  pad_centre_offset: 0.031573

  # Tolerance for the grasp-success check (M3): |achieved joint angle at
  # stall - grasp_table.yaml's grip_angle_rad, interpolated for this
  # object's width| must be within this to count as a real grasp; otherwise
  # GRIPPER_GOAL_REJECTED, abort the cycle. See docs/HANDOFF_M3.md,
  # "Pad-centre correction and grasp-success verification."
  #
  # REASONED, NOT DERIVED FOR THIS OBJECT WIDTH: no repeated-trial data
  # exists at 0.045m specifically. Set from the only same-configuration
  # repeated-measurement spread on record — the 40mm anchor's
  # 0.4358-0.4593 rad cluster across this session's re-runs, full spread
  # 0.0235 rad. Used as-is (not halved) to keep margin against a tolerance
  # picked to be exactly as tight as the one data point that produced it.
  # Refine once real repeated trials exist at this object's actual width.
  #
  # grasp_tolerance_rad and preclose_margin_rad (below) are related but
  # distinct: this one bounds the FINAL achieved-vs-expected comparison;
  # preclose_margin_rad bounds how much travel is deliberately left for
  # that final comparison to have something real to measure.
  grasp_tolerance_rad: 0.0235

  # ADDED 2026-08-11, alongside the actuated-joint effort limit fix
  # (ur5e_robotiq_description/urdf/vendor/robotiq_2f_85_macro.urdf.xacro,
  # "SEVENTH OVERRIDE") and the grasp-loss check it motivated
  # (transport.cpp, check_grasp_not_lost). Margin ABOVE grasp_table.yaml's
  # expected_grip_angle before a post-lift joint reading counts as "the
  # object left the fingers," not a tolerance around it -- the check is
  # one-sided, same reasoning as m3_grasp.cpp's own within_tolerance
  # retirement: past this angle the joint is closing into a gap, not
  # squeezing.
  # 0.01 rad chosen from this session's own data: every PASS and ordinary
  # FAIL cycle across two 20-cycle sweeps landed within 0.0029 rad of
  # touch (0.4029-0.4046 achieved against 0.4055 expected); the one
  # cycle that was a genuinely different event read 0.4186, 0.0131 rad
  # over. 0.01 rad sits between those with margin on both sides, not
  # centred by construction.
  grasp_loss_threshold_rad: 0.01

  # ADDED 2026-08-09: m3_grasp.cpp had no pre-close — the gripper stayed
  # fully open through the whole Cartesian descent, confirmed by grep
  # during the "what touches first" investigation. This was already a
  # documented spec requirement from the ejection finding
  # (gripper.preclose_heuristic below), but never implemented. It turns
  # out to matter for a second reason: with the gripper open through the
  # whole descent, the ~8-9mm of pad/knuckle descent that happens as the
  # joint closes from 0 toward grip_angle happens RIGHT NEXT TO the
  # object, eating into an already-thin clearance margin (see
  # docs/HANDOFF_M3.md, the cube-height follow-up). Pre-closing at
  # pre-grasp height (free air, nothing to contact) moves that travel out
  # of the way.
  #
  # This is the MARGIN subtracted from grasp_table.yaml's interpolated
  # grip_angle to get the pre-close target — NOT the pre-close target
  # itself, and NOT the same quantity as gripper.preclose_heuristic below
  # (that one is a free-space aperture-matching placeholder pending
  # width_map; this one works off the grasp table's AT-CONTACT
  # measurements instead, which is more directly applicable here).
  # Pre-closing to the full expected angle in free air would leave nothing
  # for the final close-and-verify call to detect — this margin keeps a
  # real, small residual stroke for that check to act on.
  #
  # UPDATED 2026-08-09, same session: 0.05 rad live-tested and found to
  # cause a NEW failure -- a trajectory capture (position-only ground-truth
  # polling of the object throughout the descent, no mesh/orientation math)
  # showed the object starts moving ~1.1s into the ~2.0s Cartesian descent,
  # well before reaching target depth. Root cause: pre-closing to
  # (0.4055 - 0.05 = 0.3555 rad) narrows true pad-to-pad clearance to only
  # ~1.4mm/side (correcting an earlier clearance miscalculation that used
  # the fingertip LINK's raw y-separation directly, not accounting for the
  # ~28mm/side inward pad inset from that reference point -- see
  # docs/HANDOFF_M3.md) against a measured ~8.7mm lateral positioning
  # error -- a lateral capture failure, not a vertical/knuckle one. 0.30
  # targeted ~0.1 rad pre-close (~12.6mm/side clearance, comfortably over
  # the measured error), and traded away most of pre-close's original
  # Z-descent-into-free-air benefit (only ~25% of the full closing motion
  # happens before descent now, not ~90%).
  #
  # CURRENT VALUE, set 2026-08-23 and VALIDATED by Milestone F2:
  # 0.4678679450464813. Against the unchanged expected grip angle
  # 0.5378679450464813 rad and the unchanged max(0, expected - margin)
  # calculation, this commands a descent pre-close target of exactly
  # 0.070000 rad. It is FROZEN. Do not tune it.
  #
  # Why it changed from 0.30 (which commanded 0.2379 rad): under F2's
  # perception-derived descent, 0.2379 rad let the RIGHT INNER KNUCKLE
  # collision mesh -- not the fingertips -- reach the object's -X top edge
  # in the last few mm of descent. Its oblique lower surface wedged the
  # object along the closing axis, ~1.4-1.6mm, failing F2's <=1mm approach
  # criterion. Proven by synchronized contact sensors: first contact was
  # robotiq_85_right_inner_knuckle_link_collision vs pick_target::link::c,
  # with object motion at the next 1ms pose sample. Large fingertip
  # aperture was irrelevant because a more proximal mesh touched first.
  #
  # 0.130 rad was tried first and generalized only to Scene B; Scene A
  # still contacted, because the actual FOLLOWER joints do not track the
  # master deterministically while the linkage is relaxing (A's right
  # inner sat ~0.058 rad more closed than B's at equal master angle).
  # 0.070 rad was then selected from a real-collision-STL sweep evaluated
  # against directly measured follower states, and validated scene by
  # scene: A-D all reached Cartesian fraction 1.0 with 0.000000mm P1->P2
  # disturbance, no premature contact, and minimum right-inner clearances
  # of 1.198/6.841/7.680/3.603 mm. Strict no-object and a full classical
  # regression also passed.
  #
  # Headroom warning: opening further costs reverse-travel time at the
  # frozen 0.1 rad/s joint limit. 0.070 rad leaves only ~0.223s before the
  # gripper helper's 5s first-result boundary; ~0.045 rad would cross it.
  # See HANDOFF.md and docs/HANDOFF_RGBD_PERCEPTION.md sec 11 for the full
  # evidence chain before changing this.
  preclose_margin_rad: 0.4678679450464813

# ---------------------------------------------------------------------------
gripper:
  # CORRECTED by recon (2026-08-03): the donor repo's `finger_joint` name does
  # NOT exist in ros-jazzy-robotiq-description 0.0.1-3. The real actuated joint
  # in that package is robotiq_85_left_knuckle_joint (5 mimics hang off it).
  # See M-1_reference_report.md §6.4. Apply tf_prefix the same as arm joints if
  # the merge ever runs with a non-empty prefix.
  actuated_joint: robotiq_85_left_knuckle_joint

  # Confirmed via recon: limit lower=0.0 upper=0.8 (radians) in
  # robotiq_2f_85_macro.urdf.xacro. Direction (0=open) matches the donor's claim;
  # only the joint name was wrong. Still resolved at runtime, not hardcoded here:
  # These are left null on purpose: the node reads them at runtime from
  #   RobotModel::getJointModel(actuated_joint)->getVariableBounds()
  # and logs what it found. Filling them in here would defeat that check.
  open_position:   null             # resolved at runtime from joint bounds
  closed_position: null             # resolved at runtime from joint bounds

  # Joint-value -> finger-opening-width mapping for the 2F-85 four-bar linkage.
  # This is NOT linear and NOT the two-prismatic-finger case. Populated from
  # recon (URDF geometry or vendor curve), then used to solve for the joint
  # angle corresponding to object width.
  width_map: null                   # RECON — [[joint_rad, width_m], ...]

  # Pre-shape aperture: close to roughly the object's width BEFORE approaching,
  # then close the remaining distance gently. Closing from full-open ejects the
  # object — measured, see report §3.5. The pick-place node must do this too;
  # M3 will fail and look like a friction problem otherwise.
  preclose_heuristic: 0.45   # rad. PLACEHOLDER until width_map exists.
  # Once width_map is populated, preclose becomes:
  #   joint_angle_for_width(object_width + clearance)
  preclose_clearance: 0.005  # m of aperture margin over object width

  # How far PAST first contact to keep commanding closed. This WAS the
  # grip-force knob back when the sim gripper was position-controlled.
  # UNITS: RADIANS OF ACTUATED JOINT ANGLE. Not metres of width.
  #
  # STALE as of the direct-effort baseline (commit f33879d): production now
  # uses effort_controllers/GripperActionController and grip force comes from
  # commanded effort (max_effort below), not from an angle overshoot. Against
  # a rigid object DART will not permit real interpenetration, so the joint
  # physically cannot advance past geometric touch and this knob has nothing
  # to act on. No production code reads grasp.squeeze -- m3_grasp.cpp mentions
  # it only in comments explaining why an angle band cannot serve as a grasp
  # verdict. Left in place unchanged; documentation note only.
  squeeze: 0.020                    # M3 tuning knob (inert under direct effort)

  max_effort: 50.0                  # ceiling passed in GripperCommand [N]
  command_timeout_s: 5.0

  # STALE KEY -- THE VALUE BELOW NO LONGER DESCRIBES THE PRODUCTION SYSTEM.
  #
  # The original note read: "If M0-B finds the sim gripper is EFFORT-controlled
  # rather than position-controlled, set this false. The squeeze knob above
  # then no longer applies and commanded effort becomes the primary knob."
  # That condition has since been met. Commit f33879d switched the actuated
  # master joint robotiq_85_left_knuckle_joint to
  # effort_controllers/GripperActionController with PID P=50, D=2, I=0. Direct
  # effort was what eliminated the destructive 18-43 Hz position-servo/contact
  # limit cycle, and it is the baseline every M8-M10, prod_reg, F1 and F2
  # result was measured on.
  #
  # The `true` below is therefore historically-worded and factually wrong for
  # the current stack. It is left AS-IS deliberately: no production code reads
  # grasp.position_controlled (verified by grep across the C++, Python and
  # YAML sources), so changing it would alter nothing but is still a value
  # change rather than a documentation fix, and this pass is documentation
  # only. Authoritative sources for how the gripper is driven, in order:
  # ur5e_robotiq_description/config/controllers.yaml, commit f33879d, and the
  # M10 section of docs/HANDOFF_M3.md. Do not reintroduce the position
  # controller or reuse the position formula on the strength of this key.
  position_controlled: true         # STALE -- see the note above; the
                                     # production gripper is direct-effort
                                     # controlled. Unused by any code.

# ---------------------------------------------------------------------------
thresholds:
  cartesian_fraction_min: 0.95      # below this -> abort, logged reason
  # tf_lookup_timeout_s: 5.0 -> 15.0 (undated, before Stage-1). Historical
  # trigger: a genuine 2026-08-22 TF_LOOKUP_TIMEOUT during startup /tf_static
  # discovery, at the then-current 2.0s deadline (observed wait 2.27s). The
  # worst upper bound actually observed across every G1-G5 and 5/5
  # repeatability run is 2.381s -- 15.0 was never approached and must NOT be
  # described as a validated value, only as the deadline in force during the
  # final G5 qualification. It changes only the clean-abort deadline, not any
  # lookup's success condition (see static_scene_tf.cpp's timer comment for
  # the related, separately-retained precaution).
  tf_lookup_timeout_s:    15.0      # exceeded -> abort
  post_lift_slip_max_m:   0.005     # M3 pass criterion: 5 mm
  # DIAGNOSABILITY (2026-08-27): 20 -> 1. With count>1 MoveIt takes the
  # ompl::tools::ParallelPlan branch in ModelBasedPlanningContext::solve(),
  # which never calls logPlannerStatus() -- so a planning failure is logged
  # only as "Unable to solve the planning problem" with no OMPL PlannerStatus.
  # That is exactly why the 2026-08-27 G5 transport PLAN_FAILURE (15.001 s)
  # produced no diagnosable evidence. At 1 attempt the PlannerStatus
  # (Invalid goal state / Timed out / ...) is emitted. Measured cost: none --
  # this transport plan solves in 21-36 ms against a 15 s budget.
  plan_attempts:          1
  planning_time_s:        15.0
  execute_timeout_s:      30.0

  # Stage 2 verification (m3_grasp.cpp, right after the descent, before the
  # close): max allowed distance between ground-truth grasp_tcp and the
  # commanded grasp pose. Exceeding this aborts with POSE_VERIFY_FAILURE
  # rather than closing on a mispositioned arm and having the cycle read as a
  # friction failure. Started at 5mm: M2 measured tcp_error_m=0.0000 on this
  # exact motion, so anything approaching the 5mm slip criterion is already a
  # positioning problem, not noise -- and it's well inside both the 14mm
  # lateral clearance at the pre-close aperture and the object's 22.5mm
  # half-height, so it won't false-fire on geometry.
  grasp_pose_error_max_m: 0.010

# ---------------------------------------------------------------------------
grasp_mode:
  # Logged verbatim at startup, one line, every run. It must never be ambiguous
  # later which mode a screenshot or CSV came from.
  #   friction  -> "GRASP MODE: friction (physics)"
  #   contact   -> "GRASP MODE: contact-triggered attach (fallback)"
  # Switching to `contact` REQUIRES explicit permission. Do not change this
  # value without it.
  #
  # UNVERIFIED PREMISE — see docs/M-1_reference_report.md §3.5.
  # dartsim does not enforce mimic constraints; gz_ros2_control appears to write
  # follower positions in software instead. Whether that yields under contact is
  # untested. `friction` here is the INTENT, not a validated capability.
  # scripts/04_mimic_contact_probe.sh is what settles it.
  mode: friction

# ---------------------------------------------------------------------------
milestones:
  m1:
    # The fixed joint goal M1 plans to, 20 times. Reachable, well away from the
    # wrist singularity, and clearly distinct from home so a "plan" that didn't
    # move can't pass. Lives here, not in the node.
    goal_positions: [0.5, -1.2, 1.0, -1.4, -1.5708, 0.0]
