# scene.yaml — SINGLE SOURCE OF TRUTH
#
# Read by, and only by, these three consumers:
#   1. the Gazebo world spawner        (where the object physically is)
#   2. the static TF publisher          (object_frame in the TF tree)
#   3. the MoveIt planning scene loader (table + object as CollisionObjects)
#
# Because all three read this file, sim and planner cannot drift apart.
# Nothing downstream is permitted to hardcode a pose. If you find yourself
# typing a coordinate into a .cpp or .launch.py file, it belongs here instead.
#
# Fields marked  # RECON  are placeholders. They are filled from the output of
# scripts/00_recon.sh run against the real merged URDF. Do not guess them.

# ---------------------------------------------------------------------------
robot:
  arm_joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  # Matches the URDF's ros2_control initial_value entries and the SRDF `home`
  # pose, so MoveIt's idea of home and Gazebo's spawn pose agree.
  home_positions: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]

  # base_link's pose in `world`. Passed through to the sim spawn launch as
  # base_xyz/base_rpy (ur5e_robotiq_sim_control.launch.py already exposes
  # these as launch args; a ground-mounted default of 0,0,0 was used through
  # M0/M1, which never needed to reach down to table height).
  #
  # RAISED to table height for M2. Found empirically via compute_ik sweeps
  # (moveit_msgs/srv/GetPositionIK, group 'arm', link 'tool0'): with tool0
  # pointed straight down (grasp.approach_axis's whole premise) and the base
  # at z=0, reachable height tops out around z=0.85-0.90m at ANY horizontal
  # offset tested (0.2m to 0.474m radius) — moving the object closer
  # horizontally did not help, because the limit is a straight-down-specific
  # wrist configuration constraint, not a radius/workspace-boundary one.
  # The grasp target alone (object.pick_pose.z + grasp.tcp_offset, BEFORE any
  # standoff) already needs tool0 at ~0.915m — past that ceiling. A
  # ground-mounted base cannot do this approach at all, regardless of
  # standoff or the object's horizontal position.
  #
  # x, y unchanged (0,0) so the horizontal geometry already measured/verified
  # (tcp_offset, M0-C, M1) is untouched; only z changes, matching table.surface_z
  # so the base effectively sits at table height. Re-verify reachability
  # after any further change to object.pick_pose or grasp.standoff — this
  # was tested for THIS specific object height and horizontal offset, not
  # proven in general.
  base_pose:
    x: 0.0
    y: 0.0
    z: 0.75
    roll:  0.0
    pitch: 0.0
    yaw:   0.0

# ---------------------------------------------------------------------------
frames:
  world:  world
  base:   base_link
  flange: tool0            # confirmed via recon: wrist_3_link -(0,0,0 / 0,-pi/2,-pi/2)->
                            # flange -(0,0,0 / pi/2,0,pi/2)-> tool0. Gripper mounts at
                            # tool0 (ROS-Industrial all-zeros tool convention).
  tcp:    grasp_tcp        # frame published at the finger-pad contact midpoint

# ---------------------------------------------------------------------------
table:
  # Box collision object. `pose` is the CENTRE of the box, expressed in `world`.
  size: [1.20, 0.80, 0.75]          # x, y, z  [m]
  pose:
    x: 0.55
    y: 0.00
    z: 0.375                        # = size.z / 2, so the base sits on z=0
    roll:  0.0
    pitch: 0.0
    yaw:   0.0
  surface_z: 0.75                   # derived: pose.z + size.z/2

# ---------------------------------------------------------------------------
object:
  name: pick_target
  type: box
  size: [0.045, 0.045, 0.090]       # x, y, z  [m]
  grasp_width_axis: 0               # index into size[] the fingers close ACROSS
                                    #   -> object width = size[grasp_width_axis]
  mass: 0.150                       # [kg]

  # Pose is the CENTRE of the object, in `world`.
  # z = table.surface_z + size.z/2  so it rests on the table, not in it.
  pick_pose:
    x:  0.450
    y: -0.150
    z:  0.795
    roll:  0.0
    pitch: 0.0
    yaw:   0.0

  place_pose:
    x:  0.450
    y:  0.200
    z:  0.795
    roll:  0.0
    pitch: 0.0
    yaw:   0.0

  # Surface physics. DART is Harmonic's default engine — ODE-era Gazebo Classic
  # friction folklore does NOT transfer. These are starting points to be
  # re-derived during M3, not values copied from a working ODE setup.
  surface:
    mu:  1.0                        # M3 tuning knob
    mu2: 1.0                        # M3 tuning knob
    restitution: 0.0

# ---------------------------------------------------------------------------
grasp:
  # The grasp is defined RELATIVE TO object_frame. Move the object in this file
  # and the grasp, pre-grasp, lift and place all follow automatically through
  # tf2 composition. Nothing is expressed as a world-Z offset.

  approach_axis: [0.0, 0.0, -1.0]   # in object_frame: descend from above
  standoff:      0.100              # pre-grasp distance back along -approach [m]
  retreat:       0.120              # post-grasp lift distance along -approach [m]
  gripper_roll:  0.0                # rotation about the approach axis [rad]

  # Distance from tool0 to the finger-pad contact midpoint, along tool0's
  # local Z ("front", ROS-Industrial convention) — the last open item from
  # M-1_reference_report.md §6. Measured live against Gazebo ground truth
  # (gz pose/info for wrist_3_link + the two fingertip links, not TF —
  # same reasoning as M0-C: this should be measured independent of what
  # MoveIt/robot_state_publisher believes, not assumed to agree with it).
  # tool0 itself never appears in the pose topic — it, flange,
  # robotiq_85_base_link and ur_to_robotiq_link are all fixed-joint-lumped
  # into wrist_3_link at the physics level (visible in the pose topic as
  # "wrist_3_link_fixed_joint_lump__..." entries). Since every joint in that
  # chain has zero translation (confirmed by recon), tool0's world POSITION
  # equals wrist_3_link's; only its orientation differs, by the two known
  # fixed rotations. Reconstructed tool0's orientation from wrist_3_link's
  # plus those two rotations, then projected (fingertip_midpoint - tool0_pos)
  # onto tool0's resulting local Z axis.
  #
  # CONFIRMED: lateral symmetry holds across the whole joint range — the
  # fingertip midpoint sits on tool0's Z axis to within ~2e-7 m regardless of
  # aperture, so tcp_offset is a clean single-axis distance, not an
  # approximation of one.
  #
  # NOT CONFIRMED, and initially assumed rather than checked: that the
  # four-bar linkage holds this distance constant as the gripper opens and
  # closes. It does not. Measured across the full range:
  #   master (rad)   tcp_offset (m)
  #     0.000            0.1093   (fully open)
  #     0.200            0.1158
  #     0.400            0.1204
  #     0.600            0.1227
  #     0.767            0.1230   (near fully closed)
  # 13.6 mm of variation, non-linear (fast rise, then saturating) — bigger
  # than M3's own 5 mm slip criterion, so treating this as one fixed scalar
  # is a real approximation, not a measured constant like the rest of this
  # file's recon-derived values.
  #
  # Value below is the 0.4 rad sample: object.size[grasp_width_axis] here is
  # 0.045 m, close to the 0.040 m box the M0-C contact probe found stalls
  # around 0.44-0.46 rad, so 0.4 rad is the closest available sample to this
  # object's actual expected grasp aperture. It is a placeholder tied to that
  # similarity, not a computed value for this exact object.
  #
  # RE-DERIVE once gripper.width_map exists: at that point tcp_offset should
  # be looked up at the aperture width_map actually computes for this
  # object's width, not read off this table by eye. Until then, grasp_tcp's
  # z-position could be off by several mm if the real contact aperture is
  # not close to 0.4 rad.
  tcp_offset: 0.1204

# ---------------------------------------------------------------------------
gripper:
  # CORRECTED by recon (2026-08-03): the donor repo's `finger_joint` name does
  # NOT exist in ros-jazzy-robotiq-description 0.0.1-3. The real actuated joint
  # in that package is robotiq_85_left_knuckle_joint (5 mimics hang off it).
  # See M-1_reference_report.md §6.4. Apply tf_prefix the same as arm joints if
  # the merge ever runs with a non-empty prefix.
  actuated_joint: robotiq_85_left_knuckle_joint

  # Confirmed via recon: limit lower=0.0 upper=0.8 (radians) in
  # robotiq_2f_85_macro.urdf.xacro. Direction (0=open) matches the donor's claim;
  # only the joint name was wrong. Still resolved at runtime, not hardcoded here:
  # These are left null on purpose: the node reads them at runtime from
  #   RobotModel::getJointModel(actuated_joint)->getVariableBounds()
  # and logs what it found. Filling them in here would defeat that check.
  open_position:   null             # resolved at runtime from joint bounds
  closed_position: null             # resolved at runtime from joint bounds

  # Joint-value -> finger-opening-width mapping for the 2F-85 four-bar linkage.
  # This is NOT linear and NOT the two-prismatic-finger case. Populated from
  # recon (URDF geometry or vendor curve), then used to solve for the joint
  # angle corresponding to object width.
  width_map: null                   # RECON — [[joint_rad, width_m], ...]

  # Pre-shape aperture: close to roughly the object's width BEFORE approaching,
  # then close the remaining distance gently. Closing from full-open ejects the
  # object — measured, see report §3.5. The pick-place node must do this too;
  # M3 will fail and look like a friction problem otherwise.
  preclose_heuristic: 0.45   # rad. PLACEHOLDER until width_map exists.
  # Once width_map is populated, preclose becomes:
  #   joint_angle_for_width(object_width + clearance)
  preclose_clearance: 0.005  # m of aperture margin over object width

  # How far PAST first contact to keep commanding closed. This is the grip-force
  # knob in a position-controlled sim.
  # UNITS: RADIANS OF ACTUATED JOINT ANGLE. Not metres of width.
  squeeze: 0.020                    # M3 tuning knob

  max_effort: 50.0                  # ceiling passed in GripperCommand [N]
  command_timeout_s: 5.0

  # If M0-B finds the sim gripper is EFFORT-controlled rather than position-
  # controlled, set this false. The squeeze knob above then no longer applies
  # and commanded effort becomes the primary knob. Say so explicitly in the
  # run log; do not silently reuse the position formula.
  position_controlled: true         # RECON — confirm at M0-B

# ---------------------------------------------------------------------------
thresholds:
  cartesian_fraction_min: 0.95      # below this -> abort, logged reason
  tf_lookup_timeout_s:    2.0       # exceeded -> abort
  post_lift_slip_max_m:   0.005     # M3 pass criterion: 5 mm
  plan_attempts:          10
  planning_time_s:        5.0
  execute_timeout_s:      30.0

# ---------------------------------------------------------------------------
grasp_mode:
  # Logged verbatim at startup, one line, every run. It must never be ambiguous
  # later which mode a screenshot or CSV came from.
  #   friction  -> "GRASP MODE: friction (physics)"
  #   contact   -> "GRASP MODE: contact-triggered attach (fallback)"
  # Switching to `contact` REQUIRES explicit permission. Do not change this
  # value without it.
  #
  # UNVERIFIED PREMISE — see docs/M-1_reference_report.md §3.5.
  # dartsim does not enforce mimic constraints; gz_ros2_control appears to write
  # follower positions in software instead. Whether that yields under contact is
  # untested. `friction` here is the INTENT, not a validated capability.
  # scripts/04_mimic_contact_probe.sh is what settles it.
  mode: friction

# ---------------------------------------------------------------------------
milestones:
  m1:
    # The fixed joint goal M1 plans to, 20 times. Reachable, well away from the
    # wrist singularity, and clearly distinct from home so a "plan" that didn't
    # move can't pass. Lives here, not in the node.
    goal_positions: [0.5, -1.2, 1.0, -1.4, -1.5708, 0.0]
