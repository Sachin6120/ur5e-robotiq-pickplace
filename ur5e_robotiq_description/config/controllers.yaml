# controllers.yaml — handed to the gz_ros2_control system plugin.
#
# Three controllers, matching what M0-B checks for. The names here MUST match
# what moveit_controllers.yaml declares once Setup Assistant has run; that
# mismatch is the single seam M0-B exists to catch.

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

# ---------------------------------------------------------------------------
arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0

# ---------------------------------------------------------------------------
gripper_controller:
  ros__parameters:
    # EXACTLY ONE JOINT. The five mimic followers
    # (right_knuckle, left/right_inner_knuckle, left/right_finger_tip) must NOT
    # appear here. Under sim_ignition they carry no command interface, so a
    # controller claiming one would fail to activate — and if it somehow did, it
    # would fight gz-sim's constraint solver. The symptom is a jittering gripper
    # that reads as a friction problem and wastes days.
    #
    # Name confirmed by recon against ros-jazzy-robotiq-description 0.0.1-3.
    # It is NOT `finger_joint` — that is the donor repo's name for a different
    # package lineage.
    joint: robotiq_85_left_knuckle_joint

    # Joint-space tolerance on reaching the commanded position, radians.
    goal_tolerance: 0.01

    # Ceiling, not the primary grip knob. In this position-controlled setup the
    # grip force knob is gripper.squeeze in config/scene.yaml, applied in
    # JOINT-ANGLE space (radians past first contact), not width space.
    max_effort: 50.0

    # Stalling is the NORMAL end state of a successful grasp: the fingers meet
    # the object and stop moving short of the commanded position. With
    # allow_stalling false, every good grasp reports as a failed goal.
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
